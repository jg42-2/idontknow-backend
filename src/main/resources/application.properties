spring.application.name=idontknow-backend
jwt.secret=${JWT_SECRET:esta-es-una-clave-secreta-de-desarrollo-cambiala-en-produccion-123456}
jwt.expiration=86400000

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

polymarket.api.url=${POLYMARKET_API_URL:https://gamma-api.polymarket.com}
server.servlet.context-path=/api/v1

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dummy@example.com}
spring.mail.password=${MAIL_APP_PASSWORD:dummy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

groq.api.key=${GROQ_API_KEY:dummy}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/idontknowdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true